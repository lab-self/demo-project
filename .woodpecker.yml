steps:

  test:
    image: alpine:3.22
    commands:
      - "echo Repository: ${CI_REPO}"
      - "echo Branch: ${CI_COMMIT_BRANCH}"
      - "echo Commit: ${CI_COMMIT_SHA}"
      - "echo Running application test..."
      - "test -f index.html"
      - "test -f Dockerfile"
      - "echo Tests passed"

  build:
    image: docker:27-cli
    commands:
      - "docker build -t demo-web:${CI_COMMIT_SHA} ."
      - "docker tag demo-web:${CI_COMMIT_SHA} demo-web:latest"
      - "echo Docker image built successfully"

  deploy:
    image: docker:27-cli
    commands:
      - "docker rm -f demo-web 2>/dev/null || true"
      - "docker run -d --name demo-web --restart unless-stopped -p 8080:80 demo-web:${CI_COMMIT_SHA}"
      - "sleep 3"
      - "docker ps --filter name=demo-web"
      - "docker inspect demo-web --format '{{.State.Status}}'"
      - "echo Deployment completed successfully"